function pivaOk(p){ p=String(p||''); if(!/^\d{11}$/.test(p)) return false; let s=0; for(let i=0;i<10;i++){ let d=+p[i]; if(i%2){ d*=2; if(d>9) d-=9; } s+=d; } return (10-s%10)%10===+p[10]; }
function cf16Ok(cf){ cf=String(cf||'').toUpperCase(); if(!/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(cf)) return false;
  const odd={0:1,1:0,2:5,3:7,4:9,5:13,6:15,7:17,8:19,9:21,A:1,B:0,C:5,D:7,E:9,F:13,G:15,H:17,I:19,J:21,K:2,L:4,M:18,N:20,O:11,P:3,Q:6,R:8,S:12,T:14,U:16,V:10,W:22,X:25,Y:24,Z:23};
  let s=0; for(let i=0;i<15;i++){ const c=cf[i]; if(i%2===0) s+=odd[c]; else s+=/\d/.test(c)?+c:c.charCodeAt(0)-65; } return String.fromCharCode(65+s%26)===cf[15]; }

/* calcolo a catena di tutti i periodi dell'anno (VP6, VP7, VP8, VP12, VP14, versamenti) */
function calc(){
  const C={}; let prev=null, used9=0;
  for(const k of keys()){
    const o=S.P[k]||{}, ov=o.ovr||{}, c={k};
    c.vp2=nz(o.vp2); c.vp3=nz(o.vp3); c.vp4=nz(o.vp4); c.vp5=nz(o.vp5);
    const A=r2(c.vp4-c.vp5); c.vp6d=A>0?A:0; c.vp6c=A<0?-A:0;
    c.a7=(prev&&!isLast(k)&&prev.vp14d>0&&prev.vp14d<=SOGLIA&&!prev.noVp14)?prev.vp14d:0;
    c.vp7=ov.vp7!=null?ov.vp7:c.a7;
    c.a8=prev?prev.vp14c:0; c.vp8=ov.vp8!=null?ov.vp8:c.a8;
    c.vp9=nz(o.vp9); c.vp10=nz(o.vp10); c.vp11=nz(o.vp11); used9=r2(used9+c.vp9); c.used9=used9;
    c.base12=r2(c.vp6d-c.vp6c+c.vp7-c.vp8-c.vp9-c.vp10-c.vp11);
    const intOk=!isM(k)&&S.trim==='opz'&&(num(k)<4||!!o.sub);
    c.intOk=intOk; c.a12=intOk&&c.base12>0?r2(c.base12*0.01):0; c.vp12=intOk?(ov.vp12!=null?ov.vp12:c.a12):0;
    c.vp13=isLast(k)?nz(o.vp13):0; c.met=isLast(k)?(o.met||''):'';
    c.noVp14=opzQ4(k)&&!o.sub;
    const x=r2(c.vp6d+c.vp7+c.vp12-c.vp6c-c.vp8-c.vp9-c.vp10-c.vp11-c.vp13);
    c.vp14d=x>0?x:0; c.vp14c=x<0?-x:0;
    /* versamento */
    c.cod=isM(k)?String(6000+num(k)):(num(k)<4?String(6030+num(k)):(S.trim==='opz'?'6099':'6034'));
    c.scad=isM(k)?SCAD_M[num(k)]:(num(k)<4?SCAD_T[num(k)]:(S.trim==='opz'?SCAD_T4_ANN:SCAD_T[4]));
    c.rinvio=c.vp14d>0&&c.vp14d<=SOGLIA&&!isLast(k)&&!(k==='m11'||k==='t3');
    c.pay=c.noVp14||c.rinvio?0:c.vp14d;
    if(c.vp14d>0&&c.vp14d<=SOGLIA&&k==='t3'){ c.scad=SCAD_RINVIO; c.nota='Importo non superiore a 100 euro: versamento entro il 16/12/'+ANNO+'.'; }
    if(c.rinvio) c.nota='Importo non superiore a 100 euro: si riporta al periodo successivo (rigo VP7).';
    if(c.noVp14) c.nota='IV trimestre dei trimestrali per opzione: il saldo si liquida nella dichiarazione IVA annuale (codice 6099, interessi 1% compresi).';
    c.compiled=compiled(o)||!!(c.vp7||c.vp8||c.vp9);
    C[k]=c; prev=c;
  }
  return C;
}

function controlli(q){
  const E=[],W=[],a=S.anag,d=S.dich,i=S.int, go=(v,t)=>`<a data-go="${v}">${t}</a>`;
  const cf=String(a.cf||'').toUpperCase();
  if(!cf) E.push('Codice fiscale del contribuente mancante. '+go('FR','Frontespizio'));
  else if(!cfOk(cf)) E.push('Codice fiscale del contribuente non valido. '+go('FR','Frontespizio'));
  if(!a.piva) E.push('Partita IVA mancante. '+go('FR','Frontespizio')); else if(!pivaOk(a.piva)) E.push('Partita IVA non valida (cifra di controllo). '+go('FR','Frontespizio'));
  if(a.pivaContr&&!pivaOk(a.pivaContr)) E.push('Partita IVA della controllante non valida.');
  if(a.pivaContr&&cf.length===16) E.push('La partita IVA della controllante non è ammessa per le persone fisiche.');
  if(a.pivaContr&&a.gruppo) E.push('Liquidazione di gruppo e partita IVA della controllante sono alternative.');
  if(cf.length===11&&!d.cf) E.push('Per i soggetti diversi dalle persone fisiche va indicato il dichiarante (codice fiscale e codice carica). '+go('FR','Frontespizio'));
  if(d.cf&&!cf16Ok(d.cf)) E.push('Codice fiscale del dichiarante non valido: deve essere di 16 caratteri.');
  if(d.cf&&!d.carica) E.push('Manca il codice carica del dichiarante.');
  if(d.cfSoc&&!pivaOk(d.cfSoc)) E.push('Codice fiscale della società dichiarante non valido (11 cifre).');
  if(!S.firma) W.push('La comunicazione non risulta firmata dal dichiarante.');
  if(i.cf){ if(!cfOk(i.cf)) E.push('Codice fiscale dell’intermediario non valido.');
    if(!i.data) E.push('Data dell’impegno alla presentazione telematica mancante.'); else if(i.data>todayIso()) E.push('La data dell’impegno non può essere successiva a oggi.');
    if(!i.firma) W.push('Impegno alla presentazione non firmato dall’intermediario.'); }
  const mods=moduliTrim(q);
  if(!mods.length) E.push('Nessun dato per il '+ROM[q]+' trimestre: compila il quadro VP del periodo.');
  if(mods.length>5) E.push('Più di cinque moduli nella stessa comunicazione.');
  keysOfTrim(q).filter(k=>!mods.includes(k)).forEach(k=>W.push(nomeP(k)+' senza dati: il modulo non viene inviato.'));
  mods.forEach(k=>{ const c=C[k],o=S.P[k]||{}, n=nomeP(k);
    if(c.vp7>SOGLIA) E.push(n+': VP7 non può superare 100,00 euro.');
    if(c.vp13>0&&c.vp13<ACC_MIN) E.push(n+': l’acconto (VP13) va indicato solo se non inferiore a 103,29 euro.');
    if(c.vp13>0&&!c.met) E.push(n+': indicare il metodo di calcolo dell’acconto (VP13 colonna 1).');
    if(c.vp12&&c.base12<=0) E.push(n+': interessi (VP12) indicati senza importo da versare.');
    if(c.vp12>0&&c.a12&&Math.abs(c.vp12-c.a12)>0.01) W.push(n+': interessi VP12 diversi dall’1% calcolato ('+fmt(c.a12)+').');
    if(o.ovr&&o.ovr.vp8!=null&&Math.abs(c.vp8-c.a8)>0.01) W.push(n+': VP8 diverso dal credito del periodo precedente ('+fmt(c.a8)+').');
    if(c.vp9<0&&(k==='m1'||k==='t1')) E.push(n+': VP9 non può essere negativo nel primo periodo dell’anno.');
    if(S.cred25!=null&&c.used9>S.cred25+0.005) W.push(n+': credito 2025 utilizzato (VP9) superiore al credito annuale indicato nel frontespizio.');
    if(!o.vp4&&!o.vp5&&!o.vp2&&!o.vp3&&!c.vp7&&!c.vp8) W.push(n+': nessuna operazione indicata (VP2–VP5).');
    if(S.anag.gruppo&&(o.vp2||o.vp3||o.sub||o.ops||o.vp10)) W.push(n+': con la liquidazione di gruppo non si indicano VP2, VP3, VP10, subfornitura e operazioni straordinarie (sono omessi dal file).');
  });
  const inv=S.inv[q]||{};
  if(inv.um&&!(inv.um==='99'?q===4:[1,2,3].map(x=>String((q-1)*3+x)).includes(inv.um)||inv.um==='13')) W.push('Ultimo mese '+inv.um+' non coerente con il '+ROM[q]+' trimestre.');
  return {E,W,mods};
}

/* ---------- importazione di un file IVP18 ---------- */
function importXml(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('il file non è un XML valido');
  const one=(p,n)=>{ const x=p.getElementsByTagNameNS('*',n)[0]; return x?x.textContent.trim():''; };
  const F=doc.getElementsByTagNameNS('*','Frontespizio')[0]; if(!F) throw new Error('frontespizio della comunicazione non trovato');
  const cf=one(F,'CodiceFiscale').toUpperCase(), anno=+one(F,'AnnoImposta')||ANNO;
  if(anno!==ANNO) throw new Error('il file riguarda l’anno '+anno+': questa app gestisce le liquidazioni '+ANNO);
  const mods=[...doc.getElementsByTagNameNS('*','Modulo')]; if(!mods.length) throw new Error('nessun modulo del quadro VP');
  const monthly=mods.some(m=>one(m,'Mese'));
  let s=(cf&&S.anag.cf&&cf===String(S.anag.cf).toUpperCase())?JSON.parse(JSON.stringify(S)):blank();
  if(s.per!==(monthly?'M':'T')&&Object.keys(s.P).some(k=>compiled(s.P[k]))&&cf===String(S.anag.cf).toUpperCase()) s.P={};
  s.per=monthly?'M':'T'; s.ex=false;
  s.anag.cf=cf; s.anag.piva=one(F,'PartitaIVA'); s.anag.pivaContr=one(F,'PIVAControllante'); s.anag.gruppo=one(F,'LiquidazioneGruppo')==='1';
  s.dich.cf=one(F,'CFDichiarante'); s.dich.carica=one(F,'CodiceCaricaDichiarante'); s.dich.cfSoc=one(F,'CodiceFiscaleSocieta');
  s.firma=one(F,'FirmaDichiarazione')!=='0';
  const ic=one(F,'CFIntermediario'); if(ic){ const dt=one(F,'DataImpegno'); s.int={cf:ic,imp:one(F,'ImpegnoPresentazione')||'1',data:dt.length===8?dt.slice(4)+'-'+dt.slice(2,4)+'-'+dt.slice(0,2):'',firma:one(F,'FirmaIntermediario')!=='0'}; }
  const v=t=>{ if(!t) return null; const x=parseAmt(t,true); return isNaN(x)?null:x; };
  let q=0;
  mods.forEach(m=>{ const me=one(m,'Mese'), tr=one(m,'Trimestre');
    const k=me?'m'+(+me):'t'+Math.min(4,+tr); if(!me&&+tr===4) s.trim='spec'; if(!me&&+tr===5) s.trim='opz';
    q=me?Math.ceil(+me/3):Math.min(4,+tr);
    const o={vp2:v(one(m,'TotaleOperazioniAttive')),vp3:v(one(m,'TotaleOperazioniPassive')),vp4:v(one(m,'IvaEsigibile')),vp5:v(one(m,'IvaDetratta')),
      vp9:v(one(m,'CreditoAnnoPrecedente')),vp10:v(one(m,'VersamentiAutoUE')),vp11:v(one(m,'CreditiImposta')),vp13:v(one(m,'Acconto')),met:one(m,'Metodo')||'',
      sub:one(m,'Subfornitura')==='1',ev:one(m,'EventiEccezionali')||'',ops:one(m,'OperazioniStraordinarie')==='1',ovr:{}};
    ['vp7:DebitoPrecedente','vp8:CreditoPeriodoPrecedente','vp12:InteressiDovuti'].forEach(p=>{ const [f,n]=p.split(':'); const x=v(one(m,n)); if(x!=null) o.ovr[f]=x; });
    s.P[k]=o; });
  const um=one(F,'UltimoMese'), fc=one(F,'FlagConferma'); if(q) s.inv[q]=Object.assign({},s.inv[q]||{},{um,conf:fc==='1'});
  S=fix(s); C=calc();
  /* i valori di VP7, VP8 e VP12 uguali al calcolo automatico tornano automatici */
  keys().forEach(k=>{ const o=S.P[k]; if(!o||!o.ovr) return; ['vp7','vp8','vp12'].forEach(f=>{ const a=C[k]['a'+f.slice(2)]; if(o.ovr[f]!=null&&Math.abs(o.ovr[f]-(a||0))<0.005) delete o.ovr[f]; }); });
  C=calc(); changed(); return {cf,q,n:mods.length};
}

   <button type="button" data-v="ARC"><span class="code">ARC</span><span class="lbl">Archivio</span></button>`;
  n.innerHTML=h; renderNavDots();
}
function renderNavDots(){
  document.querySelectorAll('#nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));
  document.querySelectorAll('#nav [data-dot]').forEach(d=>{ const k=d.dataset.dot;
    if(k==='FR'){ const ok=cfOk(S.anag.cf)&&pivaOk(S.anag.piva); d.className='dot'+(ok?' c':(S.anag.cf||S.anag.piva?' e':'')); return; }
    const c=C[k]; d.className='dot'+(c&&c.compiled?(c.vp7>SOGLIA||(c.vp13>0&&(c.vp13<ACC_MIN||!c.met))?' e':' c'):''); });
}
function go(v){ VIEW=v; if(/^[mt]\d/.test(v)) TRIM=trimOf(v); renderMain(); renderNavDots(); renderSum(); try{ window.scrollTo({top:0}); }catch(e){} }

function renderMain(){
  const m=$('#main');
  if(VIEW==='FR') return renderFront(m);
  if(VIEW==='RIE') return renderRie(m);
  if(VIEW==='VER') return renderVer(m);
  if(VIEW==='INV') return renderInv(m);
  if(VIEW==='ARC') return renderArc(m);
  if(!C[VIEW]){ VIEW='FR'; return renderFront(m); }
  renderPeriod(m,VIEW);
}

function setPath(p,v){ const ks=p.split('.'); let o=S; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=v; }

/* quadro VP di un periodo */

const cv=(n,id)=>`<span class="calcv${n?'':' z'}" data-c="${id}">${fmt(n)}</span>`;

  e.innerHTML=c.noVp14?`<span>Saldo del IV trimestre nella dichiarazione IVA annuale</span>`:

function refreshCalc(k){ const c=C[k]; if(!c) return;

const docId=()=>(String(S.anag.cf||'').toUpperCase()+'_'+ANNO).replace(/[^A-Z0-9_]/g,'');
async function salva(){
  if(!cfOk(S.anag.cf)){ toast('Indica un codice fiscale valido prima di salvare.'); go('FR'); return; }
  const rec={cf:String(S.anag.cf).toUpperCase(),ragione:S.anag.den||'',anno:ANNO,per:S.per,updated:Date.now(),json:JSON.stringify(Object.assign({},S,{ex:false}))};

  try{ const loc=JSON.parse(localStorage.getItem('lipe26-arch')||'{}'); loc[docId()]=rec; localStorage.setItem('lipe26-arch',JSON.stringify(loc)); if(!DB) toast('Comunicazione salvata su questo dispositivo.'); }catch(e){ toast('Salvataggio non riuscito.'); }

}
async function loadArchive(){
  let list=[]; if(DB){ try{ const snap=await DB.collection('dichiarazioni').get(); list=snap.docs.map(d=>Object.assign({id:d.id,src:'db'},d.data())); ARCH_STATE='ok'; }catch(e){ ARCH_STATE='errore'; } }

/* ---------- file ---------- */
function saveFile(name,blob){
  if(DL&&!window.SUITE_PARENT){ DL.save({filename:name,data:blob}).then(()=>toast('File pronto: '+name)).catch(e=>{ if(!e||e.code!=='declined') toast('Salvataggio non riuscito.'); }); return; }
  const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast('File scaricato: '+name);
}

<script>/* Frecce di scorrimento (inizio, pagina su, pagina giù, fine) – come nell'app IRAP 2026 */
(function(){
  if(document.getElementById('scrollNav')) return;
  const C={panel:'var(--panel,#f8fafa)',line:'var(--line,#ccd6d9)',acc:'var(--acc,#0f5e6e)'};
  const css=document.createElement('style');
  css.textContent=`.sn-box{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:6px}
.sn-box[hidden]{display:none!important}
.sn-box button{width:42px;height:42px;border-radius:50%;border:1px solid ${C.line};background:${C.panel};color:${C.acc};font-size:17px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding:0;font-family:system-ui,sans-serif}
.sn-box button.sm{width:34px;height:34px;font-size:14px;align-self:center}
.sn-box button:hover{border-color:${C.acc}}
.sn-box button:focus-visible{outline:2px solid ${C.acc};outline-offset:2px}
.sn-box button[disabled]{opacity:.35;cursor:default;box-shadow:none}
@media print{.sn-box{display:none!important}}`;
  document.head.appendChild(css);
  const box=document.createElement('div'); box.className='sn-box no-print'; box.id='scrollNav'; box.hidden=true;
  box.innerHTML='<button type="button" class="sm" data-sn="top" title="Inizio della pagina" aria-label="Inizio della pagina">⤒</button>'+
    '<button type="button" data-sn="up" title="Pagina su" aria-label="Pagina su">▲</button>'+
    '<button type="button" data-sn="down" title="Pagina giù" aria-label="Pagina giù">▼</button>'+
    '<button type="button" class="sm" data-sn="end" title="Fine della pagina" aria-label="Fine della pagina">⤓</button>';
  document.body.appendChild(box);
  const b=k=>box.querySelector('[data-sn="'+k+'"]');
  const smooth=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
  const maxY=()=>Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
  const step=()=>Math.round(window.innerHeight*0.85);
  const to=y=>window.scrollTo({top:Math.max(0,Math.min(maxY(),y)),behavior:smooth()});
  box.addEventListener('click',e=>{const t=e.target.closest('[data-sn]');if(!t)return;e.stopPropagation();
    const k=t.dataset.sn; if(k==='up')to(window.scrollY-step()); else if(k==='down')to(window.scrollY+step()); else if(k==='top')to(0); else to(maxY());});
  const upd=()=>{const m=maxY();box.hidden=m<40;const y=window.scrollY;
    b('up').disabled=b('top').disabled=y<=2; b('down').disabled=b('end').disabled=y>=m-2;};
  let raf=0; const sch=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;upd();});};
  window.addEventListener('scroll',sch,{passive:true}); window.addEventListener('resize',sch);
  if(window.ResizeObserver) new ResizeObserver(sch).observe(document.body);
  new MutationObserver(sch).observe(document.body,{childList:true,subtree:true});
  upd();
})();
</script>
<script>/* ================= DIRITTO ANNUALE CAMERA DI COMMERCIO 2026 =================
   Art. 18 L. 580/1993 · D.M. 21/04/2011 (misure e scaglioni) · art. 28 D.L. 90/2014 (riduzione 50%)
   Nota MIMIT 16/01/2026 (misure 2026 invariate, arrotondamenti) · D.M. MIMIT 17/03/2026 (incremento 20% 2026-2028)
   Versamento con F24, codice tributo 3850, sezione IMU e altri tributi locali, codice ente = sigla della provincia */
(function(){
  const APP='lipe';
  if(window.__dcLoaded) return; window.__dcLoaded=true;
  const ANNO='2026';
  const TIPI={
    ind_spec:{n:'Impresa individuale – sezione speciale (piccoli imprenditori, artigiani, coltivatori diretti)',sede:44,ul:8.8},
    ind_ord:{n:'Impresa individuale – sezione ordinaria',sede:100,ul:20},
    soc:{n:'Società ed enti iscritti nella sezione ordinaria (calcolo sul fatturato)',fatt:true},
    ss_agr:{n:'Società semplice agricola',sede:50,ul:10},
    ss_nagr:{n:'Società semplice non agricola',sede:100,ul:20},
    avv:{n:'Società tra avvocati (D.Lgs. 96/2001)',sede:100,ul:20},
    rea:{n:'Soggetto iscritto solo al REA',sede:15,ul:0},
    estero:{n:'Impresa con sede principale all’estero (per ogni unità locale o sede secondaria)',sede:0,ul:55}
  };
  const SCAGLIONI=[[0,100000,null],[100000,250000,.00015],[250000,500000,.00013],[500000,1000000,.0001],[1000000,10000000,.00009],[10000000,35000000,.00005],[35000000,50000000,.00003],[50000000,Infinity,.00001]];
  const PROV='AG AL AN AO AP AQ AR AT AV BA BG BI BL BN BO BR BS BT BZ CA CB CE CH CI CL CN CO CR CS CT CZ EN FC FE FG FI FM FR GE GO GR IM IS KR LC LE LI LO LT LU MB MC ME MI MN MO MS MT NA NO NU OG OR OT PA PC PD PE PG PI PN PO PR PT PU PV PZ RA RC RE RG RI RM RN RO SA SI SO SP SR SS SU SV TA TE TN TO TP TR TS TV UD VA VB VC VE VI VR VS VT VV'.split(' ');
  const SENZA_MAGG=new Set(['NA']); // camere non comprese nell'allegato A del D.M. 17/03/2026 (verificare sul sito della CCIAA)
  const r2=x=>Math.round((x+1e-9)*100)/100, r5=x=>Math.round((x+1e-12)*1e5)/1e5;
  const eu=n=>{n=Number(n)||0;const neg=n<0,c=Math.round(Math.abs(n)*100);return (neg&&c?'-':'')+String(Math.floor(c/100)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+String(c%100).padStart(2,'0')};
  const pa=v=>{let s=String(v??'').trim().replace(/[\s€]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=parseFloat(s);return isFinite(n)?n:0};
  const h=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

  /* ---------- calcolo ---------- */
  function calcola(c){
    const t=TIPI[c.tipo]||TIPI.soc, m=c.magg?1.2:1, nul=Math.max(0,parseInt(c.ul,10)||0);
    const out={righe:[],note:[],tipo:t};
    if(t.fatt){
      const f=Math.max(0,pa(c.fatt)); let base=0;
      if(c.nuova){ out.righe.push(['Misura fissa per le imprese iscritte nel '+ANNO,200]); base=200; out.note.push('Impresa iscritta nel corso del '+ANNO+': si versa la misura fissa entro 30 giorni dall’iscrizione.'); }
      else SCAGLIONI.forEach(([da,a,al])=>{ if(al===null){ out.righe.push(['Fino a 100.000 € – misura fissa',200]); base+=200; return; }
        if(f>da){ const q=Math.min(f,a)-da; const v=r5(q*al); out.righe.push([`Da ${eu(da).replace(',00','')} a ${a===Infinity?'oltre':eu(a).replace(',00','')} € – ${(al*100).toFixed(3).replace(/0+$/,'').replace('.',',')}% su ${eu(q)}`,v]); base+=v; } });
      base=r5(base); if(base>40000){ out.note.push('Importo massimo di 40.000 € (prima della riduzione).'); base=40000; }
      out.base=base; out.rid=r5(base*0.5); out.sede=r5(out.rid*m);
      out.ulUno=nul?Math.min(r5(out.sede*0.2),100*m):0;
      if(nul&&out.sede*0.2>100*m) out.note.push('Unità locali: 20% dell’importo della sede, con il massimo di '+eu(100*m)+' € per unità.');
    } else {
      out.base=t.sede; out.rid=t.sede; out.sede=r5(t.sede*m); out.ulUno=r5(t.ul*m);
      if(c.tipo==='estero'){ out.sede=0; out.note.push('Si versa 55 € (maggiorati se previsto) per ogni unità locale o sede secondaria in Italia: indicare il numero nel campo unità locali.'); }
    }
    out.ul=r5(out.ulUno*nul);
    out.totDec=r2(out.sede+out.ul); out.tot=Math.round(out.totDec);
    out.versato=Math.max(0,pa(c.versato)); out.daVersare=Math.max(0,out.tot-Math.round(out.versato));
    out.cong=out.versato>0;
    return out;
  }

  /* ---------- dati del contribuente e fatturato IRAP ---------- */
  function payload(){ try{ return window.suiteF24Payload?window.suiteF24Payload():null }catch(e){ return null } }
  function cfCorrente(){
    if(APP==='f24'){ try{ return String(state.contrib.cf||'').toUpperCase() }catch(e){ return '' } }
    const p=payload(); if(p&&p.contrib&&p.contrib.cf) return String(p.contrib.cf).toUpperCase();
    try{ if(typeof S!=='undefined'&&S&&S.B){ const v=S.B.B2||S.B.B002||''; if(v) return String(v).toUpperCase(); } }catch(e){}
    if(APP==='pf'){ const id=LS.get('rpf26_last'), a=LS.get('rpf26_archivio')||{}; if(id&&a[id]&&a[id].anag) return String(a[id].anag.cf||'').toUpperCase(); }
    return ''; }
  function fattDaQ(Q){ // righi IRAP da considerare come fatturato (circolare MiSE 19230/2009, numerazione modello IRAP 2026)
    const g=(q,c)=>(Q&&Q[q]||[]).reduce((s,o)=>s+pa(o&&o[c]),0); const parts=[];
    const add=(lbl,v)=>{ if(v) parts.push([lbl,v]); };
    add('IC1 + IC5 ricavi e altri ricavi',g('IC','IC001001')+g('IC','IC005001'));
    const ip2=g('IP','IP013001')+g('IP','IP017001'); if(ip2) add('IP13 + IP17 ricavi e altri ricavi',ip2); else add('IP1 ricavi',g('IP','IP001001'));
    add('IP52 corrispettivi (attività agricola)',g('IP','IP052001'));
    add('IE6 + IE10 ricavi dell’attività commerciale',g('IE','IE006001')+g('IE','IE010001'));
    add('IK6 + IK10 ricavi dell’attività commerciale',g('IK','IK006001')+g('IK','IK010001'));
    return {tot:parts.reduce((s,x)=>s+x[1],0),parts};
  }
  function fattIRAP(cf){
    if(APP==='irap'){ try{ const r=fattDaQ(S.Q); if(r.tot) return Object.assign(r,{fonte:'dichiarazione IRAP aperta'}); }catch(e){} }
    const cand=[]; const d=LS.get('irap26-draft'); if(d&&d.B) cand.push(d);
    const a=LS.get('irap26-arch')||{}; Object.values(a).forEach(r=>{ try{ cand.push(JSON.parse(r.json)) }catch(e){} });
    for(const s of cand){ const c=String(s.B&&s.B.B002||'').toUpperCase(); if(cf&&c===cf){ const r=fattDaQ(s.Q); if(r.tot) return Object.assign(r,{fonte:'dichiarazione IRAP 2026 in archivio'}); } }
    return null;
  }
  function tipoDefault(cf){
    if(APP==='pf') return 'ind_spec';
    if(APP==='enc') return 'rea';
    if(APP==='irap'){ try{ if((S.Q.IE||[]).some(o=>Object.keys(o).length)) return 'rea'; }catch(e){} }
    return cf&&cf.length===16?'ind_spec':'soc';
  }
  function provDefault(){
    try{ if(APP==='f24'&&state.contrib.prov) return String(state.contrib.prov).toUpperCase(); }catch(e){}
    const p=payload(); if(p&&p.contrib&&p.contrib.prov) return String(p.contrib.prov).toUpperCase();
    if(APP==='pf'){ const id=LS.get('rpf26_last'), a=LS.get('rpf26_archivio')||{}; const an=id&&a[id]&&a[id].anag; if(an&&(an.dom26Prov||an.dom25Prov)) return String(an.dom26Prov||an.dom25Prov).toUpperCase(); }
    return 'SS';
  }
  function cfgFor(cf){
    const k='dc26:'+(cf||'_'); const c=LS.get(k)||{};
    const prov=c.prov||provDefault();
    return Object.assign({tipo:tipoDefault(cf),fatt:'',ul:'0',prov,magg:!SENZA_MAGG.has(prov),versato:'',nuova:false,incl:true},c);
  }
  function saveCfg(cf,c){ LS.set('dc26:'+(cf||'_'),c); }

  /* ---------- F24 delle dichiarazioni: riga 3850 ---------- */
  function riga(cf){
    const c=cfgFor(cf); if(!LS.get('dc26:'+(cf||'_'))) return null; const r=calcola(c); const imp=r.cong?r.daVersare:r.tot;
    if(!c.incl||!imp) return null;
    return {sez:'imu',cod:'3850',ente:c.prov,anno:ANNO,imp,rat:'',scad:r.cong?'acc2':'saldo',
      desc:'Diritto annuale CCIAA '+ANNO+(r.cong?' – differenza (incremento 20%) entro il 30/11/'+ANNO:'')};
  }
  if(APP!=='f24'&&typeof window.suiteF24Payload==='function'){
    const orig=window.suiteF24Payload;
    window.suiteF24Payload=function(){ const p=orig.apply(this,arguments); if(!p) return p;
      try{ const rg=riga(String(p.contrib&&p.contrib.cf||'').toUpperCase());
        if(window.__dcSolo){ window.__dcSolo=false; p.righe=rg?[rg]:[]; p.crediti=[]; p.avvisi=[]; p.anno=ANNO; p.modello=(p.modello||'')+' – diritto annuale CCIAA'; delete p.etichetta; delete p.noMagg; delete p.noAcc2;
          if(APP==='iva'||APP==='lipe'||!p.scadenze||!p.scadenze.saldo) p.scadenze={saldo:ANNO+'-06-30',acc2:ANNO+'-11-30'}; else if(!p.scadenze.acc2) p.scadenze.acc2=ANNO+'-11-30'; p.scadNota='Diritto annuale '+ANNO+': termine del primo acconto delle imposte sui redditi; la differenza dovuta all’incremento del 20% si versa entro il 30/11/'+ANNO+'.'; return p; }
        if(rg&&APP!=='iva'&&APP!=='lipe'&&!(p.righe||[]).some(x=>x.cod==='3850')) (p.righe=p.righe||[]).push(rg);
      }catch(e){ console.error(e); }
      return p; };
  }

  /* ---------- interfaccia ---------- */
  const css=document.createElement('style');
  css.textContent=`.dc-ov{position:fixed;inset:0;z-index:70;background:rgba(10,20,28,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}

.dc-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.dc-res div{border:1px solid var(--line,var(--rule,#d5dee5));border-radius:8px;padding:9px 12px}.dc-res span{display:block;font-size:11.5px;color:var(--muted,#5b6b78)}.dc-res b{font-family:ui-monospace,Consolas,monospace;font-size:19px}
.dc-note{font-size:12.5px;color:var(--muted,#5b6b78);margin:0;padding-left:18px}.dc-note li{margin:3px 0}
.dc-act{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.dc-btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line,var(--rule,#cfd8de));background:var(--panel,#fff);color:inherit;border-radius:7px;padding:7px 12px;cursor:pointer}
.dc-btn.pri{background:var(--acc,var(--accent,var(--plum,var(--ink,#0b5d7a))));border-color:transparent;color:#fff}
.dc-warn{border-left:3px solid #b07a00;background:rgba(240,180,60,.12);padding:7px 10px;border-radius:4px;font-size:12.5px}
@media print{.dc-ov{display:none!important}}`;
  document.head.appendChild(css);

  function render(ov){
    const cf=cfCorrente(); const c=cfgFor(cf); const r=calcola(c); const fi=TIPI[c.tipo].fatt?fattIRAP(cf):null;
    const suite=!!(window.SUITE_PARENT); const imp=r.cong?r.daVersare:r.tot;
    ov.querySelector('.dc-box').innerHTML=`
    <div class="dc-hd"><div><b>Diritto annuale Camera di commercio ${ANNO}</b><small>${h(cf||'Codice fiscale non indicato')} · art. 18 L. 580/1993 · D.M. 21/04/2011 · D.L. 90/2014 · D.M. 17/03/2026</small></div><button type="button" class="dc-btn" data-dc="close">Chiudi</button></div>
    <div class="dc-bd">
      <div class="dc-g">
        <label class="w">Tipologia del soggetto<select data-k="tipo">${Object.entries(TIPI).map(([k,v])=>`<option value="${k}"${k===c.tipo?' selected':''}>${h(v.n)}</option>`).join('')}</select></label>
        ${TIPI[c.tipo].fatt?`<label>Fatturato ${ANNO-1} ai fini IRAP (€)<input class="n" data-k="fatt" value="${h(c.fatt)}" placeholder="0,00" inputmode="decimal"></label>
        <label class="ck"><input type="checkbox" data-k="nuova"${c.nuova?' checked':''}> Iscritta nel registro nel ${ANNO}</label>`:''}
        <label>Unità locali nella stessa provincia<input class="n" data-k="ul" value="${h(c.ul)}" inputmode="numeric"></label>
        <label>Camera di commercio (sigla provincia)<select data-k="prov">${PROV.map(p=>`<option${p===c.prov?' selected':''}>${p}</option>`).join('')}</select></label>
        <label class="ck"><input type="checkbox" data-k="magg"${c.magg?' checked':''}> Incremento 20% (D.M. 17/03/2026, progetti ${ANNO}-2028)</label>
        <label>Già versato per il ${ANNO} (€)<input class="n" data-k="versato" value="${h(c.versato)}" placeholder="0,00" inputmode="decimal"></label>
        ${APP!=='f24'&&APP!=='lipe'?`<label class="ck"><input type="checkbox" data-k="incl"${c.incl?' checked':''}> Includi nel Modello F24 della dichiarazione</label>`:''}
      </div>
      ${TIPI[c.tipo].fatt?`<div class="dc-sug">${fi?`Fatturato dalla ${h(fi.fonte)}: <b>${eu(fi.tot)} €</b> (${fi.parts.map(p=>h(p[0])+' '+eu(p[1])).join(' + ')})<button type="button" class="dc-btn" data-dc="usaf">Usa questo importo</button>`:'Fatturato = ricavi e altri proventi della dichiarazione IRAP '+ANNO+' (IC1 + IC5 società di capitali; IP13 + IP17 o IP1 società di persone; IP52 attività agricole; IE6 + IE10 enti) – circolare MiSE 19230/2009.'}</div>`:''}
      <table class="dc-t"><tbody>
        ${TIPI[c.tipo].fatt?r.righe.map(x=>`<tr><td>${h(x[0])}</td><td class="n">${eu(x[1])}</td></tr>`).join('')+`<tr class="s"><td>Totale per scaglioni</td><td class="n">${eu(r.base)}</td></tr><tr><td>Riduzione del 50% (art. 28 D.L. 90/2014)</td><td class="n">${eu(r.rid)}</td></tr>`
          :`<tr><td>Misura fissa ${c.tipo==='estero'?'per unità locale':'della sede'} (già ridotta del 50%)</td><td class="n">${eu(c.tipo==='estero'?TIPI.estero.ul:r.rid)}</td></tr>`}
        ${c.magg?`<tr><td>Incremento del 20% – sede</td><td class="n">${eu(r.sede)}</td></tr>`:''}
        ${(parseInt(c.ul,10)||0)>0?`<tr><td>Unità locali: ${parseInt(c.ul,10)} × ${eu(r.ulUno)}</td><td class="n">${eu(r.ul)}</td></tr>`:''}
        <tr><td>Totale (arrotondato al centesimo)</td><td class="n">${eu(r.totDec)}</td></tr>
        <tr class="tot"><td>Diritto annuale ${ANNO} dovuto (arrotondato all’unità di euro)</td><td class="n">${eu(r.tot)}</td></tr>
        ${r.cong?`<tr><td>Già versato</td><td class="n">− ${eu(r.versato)}</td></tr><tr class="tot"><td>Differenza da versare</td><td class="n">${eu(r.daVersare)}</td></tr>`:''}
      </tbody></table>
      <div class="dc-res"><div><span>Codice tributo</span><b>3850</b></div><div><span>Codice ente</span><b>${h(c.prov)}</b></div><div><span>Anno di riferimento</span><b>${ANNO}</b></div><div><span>Importo a debito</span><b>${eu(imp)}</b></div></div>
      ${r.note.length?`<div class="dc-warn">${r.note.map(h).join('<br>')}</div>`:''}
      <ul class="dc-note">
        <li>Scaglioni con 5 decimali, riduzione del 50%, incremento del 20% dove deliberato, arrotondamento al centesimo e poi all’unità di euro su tutto l’importo (sede e unità locali della stessa provincia) – nota MIMIT 16/01/2026.</li>
        <li>Termine: quello del primo acconto delle imposte sui redditi (30/06/${ANNO}, oppure entro 30 giorni con la maggiorazione dello 0,40%). Chi ha versato senza l’incremento del 20% versa la differenza entro il 30/11/${ANNO} (art. 17, c. 3, lett. b, DPR 435/2001) senza sanzioni.</li>
        <li>F24 sezione «IMU e altri tributi locali»: codice ente = sigla della provincia, codice tributo 3850, anno ${ANNO}. Unità locali in altre province: rigo separato con la sigla di quella provincia. Ravvedimento: 3851 interessi, 3852 sanzione (D.M. 54/2005).</li>
        <li>Incremento del 20% applicato da 61 camere per il triennio ${ANNO}-2028 (tutte le sarde: Sassari, Nuoro, Cagliari-Oristano). Verificare sempre l’importo sul sito della Camera competente o su dirittoannuale.camcom.it.</li>
      </ul>
      <div class="dc-act">
        ${APP==='f24'?`<button type="button" class="dc-btn pri" data-dc="f24add"${imp?'':' disabled'}>Aggiungi al modello F24 (3850 · ${h(c.prov)} · ${eu(imp)} €)</button>`
          :suite?`<button type="button" class="dc-btn pri" data-dc="f24send"${imp?'':' disabled'}>Compila il Modello F24 con il diritto annuale</button>`:''}
        <button type="button" class="dc-btn" data-dc="close">Chiudi</button>
      </div>
    </div>`;
  }
  function open(){
    let ov=document.getElementById('dcOv'); if(ov) ov.remove();
    ov=document.createElement('div'); ov.id='dcOv'; ov.className='dc-ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Diritto annuale Camera di commercio');
    ov.innerHTML='<div class="dc-box"></div>'; document.body.appendChild(ov); render(ov);
    ov.addEventListener('click',e=>{ if(e.target===ov){ ov.remove(); return; }
      const b=e.target.closest('[data-dc]'); if(!b) return; const a=b.dataset.dc; const cf=cfCorrente(); const c=cfgFor(cf);
      if(a==='close'){ ov.remove(); return; }
      if(a==='usaf'){ const fi=fattIRAP(cf); if(fi){ c.fatt=eu(fi.tot); saveCfg(cf,c); render(ov); } return; }
      if(a==='f24add'){ const r=calcola(c); const imp=r.cong?r.daVersare:r.tot; if(!imp) return;
        try{ state.imu=state.imu.filter(rowFilled); state.imu.push({...EMPTY.imu(),ente:c.prov,cod:'3850',anno:ANNO,deb:eu(imp)}); renderRows('imu'); dirty=true; recalc(); if(typeof showTab==='function') showTab('form');
          toast('Diritto annuale inserito: 3850 · '+c.prov+' · € '+eu(imp)); }catch(err){ console.error(err); } ov.remove(); return; }
      if(a==='f24send'){ saveCfg(cf,c); ov.remove(); window.__dcSolo=true; try{ window.SUITE_PARENT.SUITE.sendF24(APP); }catch(err){ window.__dcSolo=false; } return; }
    });
    const upd=e=>{ const t=e.target; const k=t.dataset&&t.dataset.k; if(!k) return; const cf=cfCorrente(); const c=cfgFor(cf);
      c[k]=t.type==='checkbox'?t.checked:t.value; if(k==='prov') c.magg=!SENZA_MAGG.has(c.prov);
      saveCfg(cf,c); if(e.type==='change'||t.tagName==='SELECT'||t.type==='checkbox') render(ov); else { const pos=t.selectionStart; render(ov); const n=ov.querySelector(`[data-k="${k}"]`); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos) }catch(_){} } } };
    ov.addEventListener('change',upd); ov.addEventListener('input',e=>{ if(e.target.tagName==='INPUT'&&e.target.type!=='checkbox') upd(e); });
    document.addEventListener('keydown',function esc(e){ if(e.key==='Escape'){ const o=document.getElementById('dcOv'); if(o) o.remove(); document.removeEventListener('keydown',esc); } });
  }
  window.dcApri=open;
  function addButton(){
    const host=document.querySelector('header.top .actions')||document.querySelector('.toolbar-inner');
    if(!host||host.querySelector('[data-dc-open]')) return;
    const b=document.createElement('button'); b.type='button'; b.className=APP==='f24'?'btn':'btn'; b.setAttribute('data-dc-open','');
    b.title='Calcolo del diritto annuale della Camera di commercio '+ANNO; b.textContent=APP==='f24'?'DIRITTO CAMERALE':'Diritto camerale';
    b.addEventListener('click',open);
    const ref=host.querySelector('[data-act="themePanel"]'); if(ref) host.insertBefore(b,ref); else host.appendChild(b);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addButton); else addButton();
})();
</script>
</body></html>
